name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Isar schemas
        run: dart run build_runner build

      - name: Format source
        run: dart format lib test

      - name: Verify release artifacts are untracked
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files 'dist/*')"
          if [[ -n "$tracked" ]]; then
            echo "::error::Build artifacts under dist/ must never be committed."
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Verify generated sources are committed
        if: github.event_name != 'pull_request'
        run: git diff --exit-code

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Prepare Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/piggyai-upload-key.jks
          chmod 600 android/app/piggyai-upload-key.jks
          test -s android/app/piggyai-upload-key.jks
          keytool -list \
            -keystore android/app/piggyai-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed Android APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/piggyai-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build signed Android App Bundle
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/piggyai-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Package signed Android artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:7}"
          app_version="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          apk_name="PiggyAI-${app_version}-release-${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          aab_name="PiggyAI-${app_version}-play-${GITHUB_RUN_NUMBER}-${short_sha}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${aab_name}"

          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "dist/${apk_name}" | tee dist/APK-SIGNATURE.txt
          if grep -qi 'Android Debug' dist/APK-SIGNATURE.txt; then
            echo "::error::Release APK is signed with the Android debug certificate."
            exit 1
          fi

          jarsigner -verify -verbose -certs "dist/${aab_name}" | tee dist/AAB-SIGNATURE.txt
          grep -qi 'jar verified' dist/AAB-SIGNATURE.txt

          (
            cd dist
            sha256sum "${apk_name}" "${aab_name}" > SHA256SUMS.txt
          )

      - name: Upload signed Android artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PiggyAI-Android-Release-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
            dist/APK-SIGNATURE.txt
            dist/AAB-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit generated and formatted files
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format source and refresh generated files"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi

      - name: Remove temporary signing material
        if: always() && github.event_name != 'pull_request'
        run: rm -f android/app/piggyai-upload-key.jks android/key.properties
