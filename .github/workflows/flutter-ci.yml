name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/offline-expense-manager')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/offline-expense-manager
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Generate missing official platform scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/settings.gradle.kts || ! -f ios/Runner.xcodeproj/project.pbxproj ]]; then
            temp_dir="$(mktemp -d)"
            flutter create \
              --org com.smartspend.app \
              --project-name smart_expense_manager \
              --template app \
              --platforms android,ios \
              "$temp_dir/generated"

            mkdir -p android ios
            rsync -a --ignore-existing "$temp_dir/generated/android/" android/
            rsync -a --ignore-existing "$temp_dir/generated/ios/" ios/
            cp "$temp_dir/generated/.metadata" .metadata
            find android/app/src/main/kotlin \
              -path "*/smart_expense_manager/MainActivity.kt" \
              -delete || true
            rm -rf "$temp_dir"
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Isar schemas
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format source
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit generated scaffold and schemas
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Flutter platform scaffolding and schemas"
            git push origin HEAD:agent/offline-expense-manager
          fi
